name: AWS CI/CD

on:
  push:
    branches: [dev, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    env:
      APP_NAME: app-${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Write .env file
        env:
          ENV_FILE_CONTENT: ${{ github.ref_name == 'main' && secrets.ENV_FILE_CONTENT_MAIN || secrets.ENV_FILE_CONTENT_DEV }}
        run: printf '%s\n' "$ENV_FILE_CONTENT" > .env

      - name: Load AWS settings from .env
        run: |
          grep -E '^(AWS_ENDPOINT_URL|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_DEFAULT_REGION)=' .env >> "$GITHUB_ENV"

      - name: Check Floci connection
        run: aws ec2 describe-key-pairs

      - name: Deploy with pm2
        run: |
          npm install -g pm2
          pm2 describe "$APP_NAME" > /dev/null \
            && pm2 restart "$APP_NAME" --update-env \
            || pm2 start index.js --name "$APP_NAME"
          pm2 save